version: 2

models:
  - name: stg_patients
    description: Deduplicated patients from the raw FHIR landing table.
    columns:
      - name: patient_id
        tests: [unique, not_null]
      - name: gender
        tests:
          - accepted_values:
              values: ['male', 'female', 'other', 'unknown']

  - name: stg_conditions
    columns:
      - name: condition_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_patients')
              field: patient_id

  - name: stg_observations
    columns:
      - name: observation_id
        tests: [unique, not_null]
      - name: patient_id
        tests: [not_null]

  - name: stg_medication_requests
    columns:
      - name: medication_request_id
        tests: [unique, not_null]
      - name: patient_id
        tests: [not_null]

  - name: stg_claims
    columns:
      - name: claim_id
        tests: [unique, not_null]
      - name: patient_id
        tests: [not_null]

  - name: stg_encounters
    columns:
      - name: encounter_id
        tests: [unique, not_null]
      - name: patient_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_patients')
              field: patient_id
